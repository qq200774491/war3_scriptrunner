[package]
name = "scriptroom"
version = "0.2.0"
edition = "2021"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "ScriptRoom"
path = "rust/gui/main.rs"

[[bin]]
name = "ScriptRoomCLI"
path = "rust/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
hex = "0.4"
rand = "0.8"
rfd = "0.15.4"
usvg = { version = "0.45.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Globalization", "Win32_Security", "Win32_Networking_WinSock"] }

[profile.release]
lto = "thin"
strip = true
